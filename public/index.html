<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Factory Bar Malad</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
    }

    :root {
      --black: #0b0710;
      --black-soft: #1a0f1f;
      --red: #b3123f;
      --red-2: #ff2f6e;
      --red-3: #ff5c8a;
      --cream: #fbf1de;
      --gold: #e3b968;
      --gold-2: #cda355;
      --gold-3: #ffe7ad;
      --accent: #ffb238;
      --accent-2: #ff6b6b;
      --violet: #a25cff;
      --paper: #fbf3e3;
      --paper-2: #fffaf0;
      --ink: #241a12;
      --muted: #7c6f78;
      --line: #e3cf9a;
      --neon-pink: #ff2f92;
      --neon-amber: #ffb238;
      --neon-cyan: #2be8d9;
      --shadow-soft: 0 10px 28px rgba(10, 5, 15, .35);
      --shadow-lift: 0 20px 52px rgba(10, 5, 15, .55);
      --shadow-gold: 0 8px 26px rgba(205, 163, 85, .45);
      --shadow-glow: 0 0 0 1px rgba(255, 47, 110, .4), 0 12px 34px rgba(255, 47, 110, .28);
      --ease: cubic-bezier(.22, .8, .32, 1);
      --ease-bounce: cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 47, 146, .5); }
      50%      { box-shadow: 0 0 0 8px rgba(255, 47, 146, 0); }
    }

    @keyframes shimmer {
      0%   { background-position: -300px 0; }
      100% { background-position: 300px 0; }
    }

    @keyframes popIn {
      0%   { opacity: 0; transform: scale(.85); }
      70%  { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes bounceIn {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    @keyframes logoGlow {
      0%, 100% { box-shadow: 0 0 0 6px rgba(255, 47, 146, .14), 0 0 18px rgba(255, 178, 56, .35), var(--shadow-soft); }
      50%      { box-shadow: 0 0 0 9px rgba(255, 47, 146, .24), 0 0 30px rgba(255, 178, 56, .55), var(--shadow-soft); }
    }

    @keyframes neonBreathePink {
      0%, 100% { text-shadow: 0 0 8px rgba(255, 47, 146, .55), 0 0 22px rgba(255, 47, 146, .32), 0 0 3px rgba(255, 255, 255, .5); }
      50%      { text-shadow: 0 0 15px rgba(255, 47, 146, .9), 0 0 36px rgba(255, 47, 146, .55), 0 0 5px rgba(255, 255, 255, .7); }
    }

    @keyframes neonBreatheCyan {
      0%, 100% { text-shadow: 0 0 8px rgba(43, 232, 217, .55), 0 0 20px rgba(43, 232, 217, .3), 0 0 3px rgba(255, 255, 255, .5); }
      50%      { text-shadow: 0 0 14px rgba(43, 232, 217, .9), 0 0 32px rgba(43, 232, 217, .55), 0 0 5px rgba(255, 255, 255, .7); }
    }

    @keyframes spotlightSway {
      0%, 100% { transform: translateX(0) rotate(0deg); opacity: .75; }
      50%      { transform: translateX(16px) rotate(1deg); opacity: 1; }
    }

    @keyframes bulbChase {
      to { background-position: 18px 0; }
    }

    @keyframes shineSweep {
      0%   { transform: translateX(-120%) skewX(-20deg); }
      100% { transform: translateX(220%) skewX(-20deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 47, 146, .4), 0 14px 32px rgba(255, 47, 146, .35); }
      50%      { box-shadow: 0 0 0 10px rgba(255, 47, 146, 0), 0 14px 32px rgba(255, 47, 146, .35); }
    }

    @keyframes dividerIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes ringExpand {
      0%   { transform: scale(.6); opacity: .8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    body {
      margin: 0;
      font-family: 'Manrope', 'Poppins', Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(720px 440px at 12% -6%, rgba(255, 47, 146, .20), transparent 60%),
        radial-gradient(640px 420px at 100% 0%, rgba(43, 232, 217, .13), transparent 55%),
        radial-gradient(900px 620px at 50% 112%, rgba(205, 163, 85, .16), transparent 60%),
        linear-gradient(180deg, #0b0710 0%, #150c1c 45%, #17101d 100%);
      background-attachment: fixed;
    }

    html, body {
      width: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--gold);
      color: var(--black);
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--neon-pink), var(--gold-2));
      border-radius: 10px;
    }

    .container {
      width: 100%;
      max-width: none;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      box-sizing: border-box;

      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(48px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding-top: 32px;
      }
    }

    @media (min-width: 1280px) {
      .container {
        max-width: 1120px;
      }
    }

    .header {
      position: relative;
      text-align: center;
      background:
        linear-gradient(160deg, #120b17 0%, var(--black) 60%, #0d0910 100%);
      border-radius: 22px;
      padding: 30px 16px 34px;
      margin-bottom: 26px;
      border: 2px solid var(--gold-2);
      box-shadow: var(--shadow-lift), inset 0 1px 0 rgba(255, 255, 255, .04);
      overflow: hidden;
      animation: fadeInUp .5s var(--ease) both;
    }

    .header::before {
      content: "";
      position: absolute;
      inset: -40% -20% auto -20%;
      height: 230px;
      background:
        radial-gradient(60% 60% at 28% 0%, rgba(255, 47, 146, .38), transparent 70%),
        radial-gradient(50% 60% at 76% 0%, rgba(43, 232, 217, .28), transparent 70%);
      filter: blur(6px);
      animation: spotlightSway 7s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .header::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      height: 6px;
      background-image: radial-gradient(circle, var(--neon-amber) 0 2.6px, transparent 3px);
      background-size: 18px 100%;
      background-repeat: repeat-x;
      opacity: .9;
      filter: drop-shadow(0 0 4px var(--neon-amber));
      animation: bulbChase 1.3s linear infinite;
      z-index: 1;
    }

    .brand-logo {
      position: relative;
      z-index: 1;
      width: clamp(84px, 18vw, 128px);
      height: clamp(84px, 18vw, 128px);
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 2px solid var(--gold-2);
      animation: floatUp 5s ease-in-out infinite, logoGlow 3.2s ease-in-out infinite;
      background: #0c0c0c;
    }

    .brand-name {
      position: relative;
      z-index: 1;
      color: var(--cream);
      font-family: 'Monoton', cursive;
      font-weight: 400;
      font-size: clamp(22px, 5.4vw, 36px);
      line-height: 1.5;
      letter-spacing: 1px;
      animation: neonBreathePink 3.6s ease-in-out infinite;
    }

    .brand-name span {
      color: var(--neon-cyan);
      animation: neonBreatheCyan 3.6s ease-in-out infinite;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      color: var(--gold-3);
      font-family: 'Space Mono', monospace;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 12px;
      opacity: .92;
    }

    .section-title {
      position: relative;
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-size: clamp(23px, 5vw, 32px);
      font-weight: 800;
      margin: 6px 0 18px;
      padding-left: 18px;
      color: var(--gold-3);
      letter-spacing: -.2px;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .5);
    }

    .section-title::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 5px;
      border-radius: 6px;
      background: linear-gradient(180deg, var(--neon-pink), var(--gold-2));
      box-shadow: 0 0 10px rgba(255, 47, 146, .5);
    }

    #formSection > .section-title {
      font-size: clamp(26px, 6vw, 34px);
      margin-bottom: 22px;
      color: var(--ink);
      text-shadow: none;
    }

    .form-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0 20px;
      animation: dividerIn .4s var(--ease) both;
    }

    .form-divider span {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 17px;
      font-weight: 900;
      color: var(--black);
      white-space: nowrap;
      letter-spacing: -.2px;
    }

    .form-divider::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--gold-2), transparent);
      border-radius: 2px;
    }

    .back-event-button {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--paper-2);
      color: var(--ink);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin: 0 0 18px;
      transition: transform .15s var(--ease), background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
      box-shadow: var(--shadow-soft);
    }

    .back-event-button:hover {
      background: var(--black);
      color: var(--cream);
      border-color: var(--black);
      box-shadow: var(--shadow-lift);
    }

    .back-event-button:active {
      transform: scale(.97);
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      padding: 12px 20px;
      border: 1.5px solid var(--gold);
      border-radius: 999px;
      color: var(--black);
      background: linear-gradient(135deg, #fffdf7, #f6ecd4);
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      transition: transform .15s var(--ease), box-shadow .2s ease;
      box-shadow: var(--shadow-soft);
    }

    .instagram-link:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-gold);
    }

    #loading {
      color: #dcc9e6 !important;
    }

    #eventsContainer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    #eventsContainer p {
      color: var(--gold-3);
      text-align: center;
      font-weight: 600;
    }

    @media (min-width: 1024px) {
      #eventsContainer {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1280px) {
      #eventsContainer {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .event-card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 22px 22px 26px;
      cursor: pointer;
      background: var(--paper-2);
      box-shadow: var(--shadow-soft);
      transition: transform .18s var(--ease), box-shadow .25s ease, border-color .25s ease;
      animation: fadeInUp .45s var(--ease) both;
      overflow: hidden;
    }

    #eventsContainer .event-card:nth-child(1) { animation-delay: .02s; }
    #eventsContainer .event-card:nth-child(2) { animation-delay: .07s; }
    #eventsContainer .event-card:nth-child(3) { animation-delay: .12s; }
    #eventsContainer .event-card:nth-child(4) { animation-delay: .17s; }
    #eventsContainer .event-card:nth-child(5) { animation-delay: .22s; }
    #eventsContainer .event-card:nth-child(6) { animation-delay: .27s; }
    #eventsContainer .event-card:nth-child(n+7) { animation-delay: .3s; }

    .event-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(180deg, var(--gold-2), var(--neon-pink));
      opacity: .9;
    }

    .event-card:hover {
      border-color: var(--gold-2);
      box-shadow: var(--shadow-lift), 0 0 0 1px rgba(255, 47, 146, .15);
      transform: translateY(-4px);
    }

    .event-card:hover .radio {
      box-shadow: 0 0 16px var(--neon-amber);
    }

    .event-card:active {
      transform: scale(.98);
    }

    .event-card.full {
      opacity: .58;
      cursor: not-allowed;
      filter: grayscale(.3);
    }

    .event-card.full:hover {
      transform: none;
      box-shadow: var(--shadow-soft);
    }

    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .event-top > :first-child {
      flex: 1;
      min-width: 0;
    }

    .event-name {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: clamp(20px, 5.6vw, 24px);
      line-height: 1.35;
      color: var(--ink);
      letter-spacing: -.2px;
    }

    .event-info {
      color: var(--muted);
      font-size: clamp(15px, 4vw, 16.5px);
      line-height: 1.55;
      margin-top: 8px;
    }

    .price-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .redeemable-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .2px;
      background: linear-gradient(135deg, #eaf7ee, #f0f6ef);
      color: #1a7a3c;
      border: 1px solid #bfe0c6;
    }

    .redeemable-badge.no {
      background: linear-gradient(135deg, #fdeeee, #f8eeee);
      color: #a71920;
      border-color: #e8bfc2;
    }

    .price {
      font-family: 'Space Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      margin-top: 0;
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
    }

    .price.free {
      color: #0b7d6b;
      background: #e3faf6;
    }

    .price.paid {
      color: var(--ink);
      background: #f2e9ce;
    }

    .free { color: #0b7d6b; }
    .paid { color: var(--ink); }

    .full-label {
      display: inline-block;
      color: #fff;
      background: linear-gradient(135deg, var(--red-2), #8f151c);
      font-weight: 800;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .3px;
    }

    .radio {
      position: relative;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow .25s ease;
    }

    .radio::after {
      content: "\203A";
      color: var(--black);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      transform: translateX(1px);
    }

    .event-card.full .radio {
      background: #ddd3ba;
    }

    .table-suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    @media (min-width: 1024px) {
      .table-suggestions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 1280px) {
      .table-suggestions {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .table-card {
      position: relative;
      border: 2px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: var(--paper-2);
      cursor: pointer;
      transition: border-color .2s var(--ease), box-shadow .25s ease, transform .18s var(--ease);
      box-shadow: var(--shadow-soft);
    }

    .table-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lift);
    }

    .table-card.selected {
      border-color: var(--red-2);
      box-shadow: 0 0 0 4px rgba(255, 47, 146, .16), var(--shadow-lift);
      animation: glow 1.8s ease-in-out infinite;
    }

    .table-card.selected::after {
      content: "\2713";
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--red-2), #8f151c);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(255, 47, 146, .45);
      z-index: 2;
      animation: bounceIn .35s var(--ease) both;
    }

    .table-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #eee;
      cursor: zoom-in;
      transition: transform .35s var(--ease), filter .25s ease;
    }

    .table-card:hover img {
      transform: scale(1.06);
      filter: brightness(1.03);
    }

    .table-card-body {
      padding: 14px 16px 16px;
    }

    .table-card-title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--ink);
    }

    .table-card-meta {
      color: var(--muted);
      font-size: 15px;
      margin-top: 5px;
      line-height: 1.4;
    }

    .table-status {
      color: #0b7d6b;
      font-size: 14.5px;
      font-weight: 800;
      margin-top: 9px;
      letter-spacing: .2px;
    }

    .table-card.selected .table-status {
      color: var(--red-2);
    }

    .payment-method-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .table-photo-modal {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(8, 6, 4, .88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s var(--ease), visibility .25s var(--ease);
    }

    .table-photo-modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .table-photo-modal img {
      max-width: 94vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
      border: 1px solid rgba(205, 163, 85, .4);
      box-shadow: 0 25px 70px rgba(0, 0, 0, .6);
      transform: scale(.92);
      transition: transform .3s var(--ease);
    }

    .table-photo-modal.open img {
      transform: scale(1);
    }

    .table-photo-close {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: var(--paper-2);
      color: var(--black);
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      z-index: 10000;
      box-shadow: var(--shadow-lift);
      transition: transform .15s var(--ease);
    }

    .table-photo-close:hover {
      transform: rotate(90deg);
    }

    .form-section {
      display: none;
      animation: fadeInUp .4s var(--ease) both;
      background: var(--paper-2);
      border: 1.5px solid var(--line);
      border-radius: 22px;
      padding: 22px 18px 28px;
      box-shadow: var(--shadow-lift);
    }

    @media (min-width: 1024px) {
      .form-section {
        padding: 32px;
      }
    }

    .field {
      margin-bottom: 26px;
      animation: fadeInUp .4s var(--ease) both;
    }

    label {
      display: block;
      font-size: clamp(17px, 4.2vw, 19px);
      font-weight: 800;
      margin-bottom: 10px;
      color: var(--ink);
      letter-spacing: -.2px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 62px;
      padding: 16px 18px;
      border: 2px solid #d8cca4;
      border-radius: 14px;
      font-size: 18px;
      background: #fffefb;
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
      transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--gold-2);
      box-shadow: 0 0 0 5px rgba(205, 163, 85, .28);
      transform: translateY(-1px);
    }

    input[readonly] {
      background: #f2ecd8;
      color: var(--ink);
      font-weight: 800;
    }

    .date-note {
      color: var(--muted);
      font-size: 14.5px;
      margin-top: 9px;
      line-height: 1.55;
      font-weight: 500;
    }

    .summary {
      position: relative;
      background: linear-gradient(160deg, var(--black), var(--black-soft) 60%, #1f1a14);
      border: 1.5px solid var(--gold-2);
      padding: 26px;
      border-radius: 20px;
      margin: 26px 0;
      box-shadow: var(--shadow-lift);
      overflow: hidden;
      color: var(--cream);
    }

    .summary::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(340px 160px at 100% 0%, rgba(255, 47, 146, .22), transparent 60%);
      pointer-events: none;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 17px;
      color: var(--cream);
      font-weight: 600;
      position: relative;
    }

    .summary-row span {
      color: #c8bda3;
    }

    .summary-row strong {
      font-weight: 800;
    }

    .summary-total {
      border-top: 1.5px dashed rgba(205, 163, 85, .55);
      padding-top: 16px;
      margin-top: 14px;
      font-size: 23px;
      font-weight: 900;
      position: relative;
    }

    .summary-total strong {
      color: var(--gold-3);
      font-size: 26px;
      text-shadow: 0 0 18px rgba(255, 178, 56, .5);
    }

    .payment-box {
      display: none;
      position: relative;
      background: linear-gradient(160deg, #fffaea, #fdf3d6);
      border: 2px solid var(--gold-2);
      border-radius: 22px;
      padding: 28px;
      margin: 24px 0;
      box-shadow: var(--shadow-glow);
      animation: fadeInUp .35s var(--ease) both;
    }

    .payment-title {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 14px;
      color: var(--black);
    }

    .amount {
      font-family: 'Space Mono', monospace;
      font-size: 38px;
      font-weight: 700;
      margin: 10px 0 18px;
      color: var(--red-2);
      letter-spacing: -1px;
      text-shadow: 0 4px 18px rgba(255, 47, 110, .3);
    }

    .payee {
      background: linear-gradient(135deg, var(--black), #211c15);
      color: var(--cream);
      padding: 15px 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 16px;
      text-align: center;
      margin-bottom: 18px;
      letter-spacing: .2px;
    }

    .qr-container {
      position: relative;
      background: #fff;
      border: 1.5px solid #e5d8ac;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
    }

    .qr-container::before,
    .qr-container::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      border: 4px solid var(--gold-2);
    }

    .qr-container::before {
      top: 8px;
      left: 8px;
      border-right: none;
      border-bottom: none;
      border-radius: 8px 0 0 0;
    }

    .qr-container::after {
      bottom: 8px;
      right: 8px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 8px 0;
    }

    .qr-title {
      font-weight: 900;
      margin-bottom: 14px;
      color: var(--black);
      font-size: 19px;
    }

    .qr-loading {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      padding: 28px 5px;
      background: linear-gradient(90deg, #eee 0%, #f7f1e0 50%, #eee 100%);
      background-size: 600px 100%;
      animation: shimmer 1.6s linear infinite;
      border-radius: 12px;
    }

    .upi-qr {
      width: min(280px, 100%);
      height: auto;
      display: block;
      margin: 4px auto 0;
      border-radius: 12px;
      animation: popIn .4s var(--ease) both;
      box-shadow: var(--shadow-soft);
    }

    .upi-id-box {
      margin-top: 18px;
      background: #fff;
      border: 1.5px solid #e5d8ac;
      border-radius: 16px;
      padding: 16px 18px;
    }

    .upi-id-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .upi-id-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #upiIdText {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: .3px;
      color: var(--ink);
    }

    .copy-upi-button {
      border: 2px solid var(--gold-2);
      background: linear-gradient(135deg, #fffdf7, #f6ecd4);
      color: var(--ink);
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s var(--ease), box-shadow .2s ease;
    }

    .copy-upi-button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-gold);
    }

    .payment-note {
      color: var(--muted);
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1.65;
      margin-top: 16px;
      text-align: center;
    }

    .pay-button,
    .book-button {
      position: relative;
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, var(--red-3), var(--red-2) 45%, #8f151c);
      color: white;
      padding: 19px;
      border-radius: 16px;
      margin-top: 16px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .3px;
      border: 0;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 14px 32px rgba(255, 47, 110, .4);
      transition: transform .15s var(--ease), box-shadow .2s ease;
      animation: pulseGlow 2.6s ease-in-out infinite;
    }

    .pay-button::before,
    .book-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .45), transparent);
      animation: shineSweep 2.6s ease-in-out infinite;
    }

    .pay-button:hover,
    .book-button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(255, 47, 110, .5);
    }

    .pay-button:active,
    .book-button:active:not(:disabled) {
      transform: scale(.97);
    }

    .book-button:disabled {
      opacity: .5;
      cursor: not-allowed;
      box-shadow: none;
      animation: none;
    }

    .book-button:disabled::before {
      animation: none;
    }

    .upload-box {
      border: 2.5px dashed var(--gold-2);
      padding: 22px;
      border-radius: 16px;
      background: #fffefb;
      text-align: center;
      transition: border-color .2s ease, background .2s ease;
    }

    .upload-box:hover {
      border-color: var(--red-2);
      background: #fdf8ea;
    }

    .file-name {
      font-size: 14.5px;
      color: var(--ink);
      margin-top: 10px;
      font-weight: 700;
    }

    .book-another-button {
      width: 100%;
      border: 2px solid var(--gold-2);
      background: var(--paper-2);
      color: var(--ink);
      padding: 18px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 18px;
      transition: transform .15s var(--ease), box-shadow .2s ease, background .2s ease, color .2s ease;
    }

    .book-another-button:hover {
      background: var(--black);
      color: var(--gold-3);
      border-color: var(--black);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lift);
    }

    .error {
      display: none;
      background: linear-gradient(135deg, #fff0f0, #fde7e7);
      color: #b00020;
      padding: 16px 18px;
      border-radius: 14px;
      margin-bottom: 18px;
      font-size: 15.5px;
      font-weight: 700;
      border: 2px solid #f3c6c6;
      animation: fadeInUp .3s var(--ease) both;
    }

    .success {
      display: none;
      text-align: center;
      padding: 34px 20px 30px;
      animation: fadeInUp .45s var(--ease) both;
      background: var(--paper-2);
      border: 2px dashed var(--gold-2);
      border-radius: 22px;
      box-shadow: var(--shadow-lift);
    }

    .success-icon {
      position: relative;
      font-size: 66px;
      display: inline-block;
      animation: bounceIn .6s var(--ease-bounce) both;
    }

    .success-icon::before,
    .success-icon::after {
      content: "";
      position: absolute;
      inset: -14px;
      border: 2px solid var(--gold-2);
      border-radius: 50%;
      animation: ringExpand 1.8s ease-out infinite;
    }

    .success-icon::after {
      animation-delay: .5s;
    }

    .success h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 32px;
      font-weight: 900;
      margin: 18px 0 8px;
      color: var(--ink);
    }

    .success > p {
      font-size: 17px;
      color: var(--muted);
      font-weight: 500;
    }

    .booking-id {
      background: linear-gradient(160deg, var(--black), var(--black-soft));
      border: 1.5px dashed var(--gold-2);
      padding: 20px;
      border-radius: 16px;
      margin: 22px 0;
      font-weight: 700;
      color: var(--cream);
    }

    #bookingId {
      font-family: 'Space Mono', monospace;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: .8px;
      color: var(--gold-3);
    }

    .booking-confirmation-note {
      font-size: 15.5px;
      color: var(--muted);
      line-height: 1.65;
      margin-top: 14px;
      font-weight: 500;
    }

    .required-mark {
      color: var(--red-2);
      font-weight: 900;
    }

    .small {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.6;
      font-weight: 500;
    }

    .redeemable-label {
      display: inline-block;
      margin-top: 7px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .redeemable-yes {
      color: #1a7a3c;
      background: #eaf7ee;
      border: 1px solid #b9d9bf;
    }

    .redeemable-no {
      color: #a71920;
      background: #fff0f0;
      border: 1px solid #e0b5b8;
    }

    .summary-redeemable {
      display: block !important;
      width: 100%;
      box-sizing: border-box;
      text-align: right;
      margin-top: 8px;
      padding-right: 0;
    }

    .big-group-message,
    .table-unavailable-message,
    .solo-visitor-message {
      background: linear-gradient(160deg, #fffaea, #fdf3d6);
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 22px 18px;
      margin-top: 12px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      animation: fadeInUp .35s var(--ease) both;
    }

    .big-group-message {
      font-size: 16px;
      line-height: 1.65;
    }

    .group-phone {
      display: inline-block;
      font-size: 21px;
      font-weight: 900;
      color: var(--red-2);
      text-decoration: none;
      margin-top: 6px;
    }

    .table-unavailable-message {
      grid-column: 1 / -1;
      width: 100%;
    }

    .table-unavailable-title {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 10px;
      color: var(--ink);
    }

    .table-unavailable-text {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .table-unavailable-help {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }

    .table-phone {
      display: inline-block;
      font-size: 20px;
      font-weight: 900;
      color: var(--red-2);
      text-decoration: none;
      margin-top: 6px;
    }

    .solo-visitor-message {
      grid-column: 1 / -1;
      width: 100%;
      margin-bottom: 4px;
    }

    .solo-visitor-title {
      font-size: 19px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .solo-visitor-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }

    @media (max-width: 540px) {
      body {
        overflow-x: hidden;
      }
      .container {
        width: 100%;
        max-width: 100%;
        min-height: 100svh;
        padding: 12px 12px 40px;
      }
      .header {
        margin-bottom: 18px;
      }
      input, select, textarea, button {
        max-width: 100%;
        min-width: 0;
      }
      input[type="tel"] {
        font-size: 16px;
        letter-spacing: .3px;
      }
      input[type="date"] {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        display: block;
      }

      @supports (-webkit-touch-callout: none) {
        input[type="date"] {
          width: 100%;
          max-width: 100%;
          min-width: 0;
          box-sizing: border-box;
          display: block;
        }
      }

      .table-card img {
        height: 150px;
      }
    }

  </style>

</head>

<body>

<div class="container">

 <!-- HEADER -->
  <div class="header">
    <img
      class="brand-logo"
      src="data:image/jpeg;base64,/9j/4AAQSkZ..."
      alt="Factory Bar Malad Logo"
    />
    <h1 class="brand-title">Factory Bar Malad</h1>
    <p class="brand-subtitle">Upcoming Events & Table Reservations</p>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="main-container">
    
    <!-- LOADING SPINNER -->
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Loading active events...</p>
    </div>

    <!-- EVENTS SECTION -->
    <div id="eventsContainer" class="events-grid">
      <!-- Dynamic Event Cards will be injected here via JavaScript -->
    </div>

    <!-- RESERVATION FORM SECTION -->
    <div id="formSection" class="form-container" style="display: none;">
      <h2>Book Your Spot</h2>
      <form id="bookingForm">
        <input type="hidden" id="selectedEventId" name="eventId" />
        
        <div class="form-group">
          <label for="userName">Full Name</label>
          <input type="text" id="userName" name="userName" required placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label for="userPhone">Phone Number</label>
          <input type="tel" id="userPhone" name="userPhone" required placeholder="Enter your mobile number" />
        </div>

        <div class="form-group">
          <label for="guestCount">Number of Guests</label>
          <input type="number" id="guestCount" name="guestCount" min="1" max="20" value="2" required />
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Confirm Reservation</button>
      </form>
    </div>

    <!-- STATUS MESSAGE -->
    <div id="statusMessage" class="status-message" style="display: none;"></div>

  </div>

  <!-- FRONT-END CLIENT SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Fetch events from Apps Script backend on load
      google.script.run
        .withSuccessHandler(renderEvents)
        .withFailureHandler(handleError)
        .getEventsData();
    });

    function renderEvents(events) {
      const loading = document.getElementById('loading');
      const container = document.getElementById('eventsContainer');
      
      if (loading) loading.style.display = 'none';
      if (!events || events.length === 0) {
        container.innerHTML = '<p class="no-events">No upcoming events found.</p>';
        return;
      }

      container.innerHTML = events.map(event => `
        <div class="event-card">
          <img src="${event.imageUrl || 'https://via.placeholder.com/300'}" alt="${event.title}" class="event-img" />
          <div class="event-details">
            <h3>${event.title}</h3>
            <p class="event-date">📅 ${event.date}</p>
            <p class="event-desc">${event.description || ''}</p>
            <button class="book-btn" onclick="selectEvent('${event.id}', '${event.title}')">Select Event</button>
          </div>
        </div>
      `).join('');
    }

    function selectEvent(id, title) {
      document.getElementById('selectedEventId').value = id;
      document.getElementById('formSection').style.display = 'block';
      document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing...';

      const formData = {
        eventId: document.getElementById('selectedEventId').value,
        name: document.getElementById('userName').value,
        phone: document.getElementById('userPhone').value,
        guests: document.getElementById('guestCount').value
      };

      google.script.run
        .withSuccessHandler(onBookingSuccess)
        .withFailureHandler(handleError)
        .processBooking(formData);
    });

    function onBookingSuccess(response) {
      const status = document.getElementById('statusMessage');
      document.getElementById('bookingForm').reset();
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').innerText = 'Confirm Reservation';
      
      status.style.display = 'block';
      status.className = 'status-message success';
      status.innerText = 'Reservation confirmed! We look forward to hosting you.';
    }

    function handleError(err) {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
      
      const status = document.getElementById('statusMessage');
      status.style.display = 'block';
      status.className = 'status-message error';
      status.innerText = 'An error occurred: ' + (err.message || err);
      
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Confirm Reservation';
      }
    }
  </script>
</body>
</html>
